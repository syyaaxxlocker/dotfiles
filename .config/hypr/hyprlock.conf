# ~/.config/hypr/hyprlock.conf

general {
    hide_cursor = true
    grace = 0
}

# Фон: размытые обои с лёгким затемнением
background {
    monitor =
    path = screenshot # или укажи путь к своим обоям, например ~/Pictures/wall.png
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 1.1
    brightness = 0.75
    vibrancy = 0.2
    vibrancy_darkness = 0.1
}

# Время: крупно, по центру, цвет fg
label {
    monitor =
    text = $TIME
    font_family = RobotoMono Nerd Font
    font_size = 120
    color = #e0e2e1
    position = 0, 180
    halign = center
    valign = center
}

# Дата: ниже часов, приглушённый цвет
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = RobotoMono Nerd Font
    font_size = 22
    color = rgba(224, 226, 225, 0.6)
    position = 0, 90
    halign = center
    valign = center
}

# Имя пользователя: приветствие над полем ввода
label {
    monitor =
    text = $USER
    font_family = RobotoMono Nerd Font
    font_size = 18
    color = #e0e2e1
    position = 0, -70
    halign = center
    valign = center
}

# Поле ввода пароля: акцентная обводка в цвет waybar
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    rounding = 10
    outer_color = #1a6e4d
    inner_color = rgba(25, 27, 26, 0.8)
    font_color = #e0e2e1
    font_family = RobotoMono Nerd Font
    placeholder_text = <i><span foreground="##e0e2e1">Password…</span></i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fade_on_empty = false
    hide_input = false
    position = 0, -130
    halign = center
    valign = center
}

# Небольшая подсказка внизу, едва заметная
label {
    monitor =
    text = Enter to unlock
    font_family = RobotoMono Nerd Font
    font_size = 14
    color = rgba(224, 226, 225, 0.35)
    position = 0, -200
    halign = center
    valign = center
}
